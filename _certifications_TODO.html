<!--
  ══════════════════════════════════════════════════════════════
  CERTIFICATIONS — À RÉINTÉGRER QUAND J'AUREAIS MES CERTICATION
  ══════════════════════════════════════════════════════════════

  ÉTAPES POUR RÉINTÉGRER :
  1. Colle la section HTML dans index.html (avant le footer)
  2. Ajoute le lien nav dans index.html : <li><a href="#certifications">Certifications</a></li>
  3. Ajoute le lien footer dans index.html : <a href="#certifications">Certifications</a>
  4. Colle le bloc CSS dans css/style.css (avant la section VEILLE)
  5. Colle le bloc JS dans script.js (avant la section barre de progression)
  6. Remplis le tableau `certifs` dans le JS avec tes vraies certifications

  FORMAT D'UN OBJET CERTIFICATION :
  { icon: '🏅', title: 'Nom de la certification', desc: 'Description courte.', empty: false }
  ══════════════════════════════════════════════════════════════
-->


<!-- ══ HTML — coller dans index.html avant le footer ══ -->

<section id="certifications">
  <div class="container">
    <div class="certif-header">
      <div class="section-badge"><span class="badge-star">✶</span> <span>CERTIFICATIONS</span></div>
      <h2 class="certif-h2">Mes <span class="grad-green">certifications</span>.</h2>
      <p class="certif-sub">Découvrez les certifications que j'ai obtenues au fil de mon parcours.</p>
    </div>
    <div class="certif-carousel">
      <button class="certif-nav" onclick="changeCertif(-1)" aria-label="Précédent">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="certif-circle empty" id="certif-circle" style="background:linear-gradient(160deg,#6DD5FA 40%,#2980B9 80%);">
        <span id="certif-icon">📦</span>
      </div>
      <button class="certif-nav" onclick="changeCertif(1)" aria-label="Suivant">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <div class="certif-info empty" id="certif-info">
      <h2 id="certif-title">À remplir</h2>
      <p id="certif-desc">Nom et description de la certification à ajouter ici.</p>
    </div>
  </div>
</section>

<!-- ══ JS — coller dans script.js avant la section barre de progression ══ -->

 let certIdx = 0;
 window.changeCertif = function(dir) {
   certIdx = (certIdx + dir + certifs.length) % certifs.length;
   const c = certifs[certIdx];
   const iconEl = document.getElementById('certif-icon');
   const titleEl = document.getElementById('certif-title');
   const descEl = document.getElementById('certif-desc');

   if (descEl) descEl.textContent = c.desc;
   if (circleEl) circleEl.className = 'certif-circle' + (c.empty ? ' empty' : '');
   if (infoEl) infoEl.className = 'certif-info' + (c.empty ? ' empty' : '');
 };
