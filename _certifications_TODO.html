<!--A coller entre section et Veille-->
<!-- ── CERTIFICATIONS ── --> 
<section id="certifications"> 
  <div class="container"> 
    <div class="certif-header"> 
      <div class="section-badge"><span class="badge-star">✶</span> <span>CERTIFICATIONS</span></div> 
      <h2 class="certif-h2">Mes <span class="grad-green">certifications</span>.</h2> 
      <p class="certif-sub">Découvrez les certifications que j'ai obtenues au fil de mon parcours.</p> 
    </div> 
    <div class="certif-carousel"> 
      <button class="certif-nav" onclick="changeCertif(-1)" aria-label="Précédent"> 
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg> 
      </button> 
      <div class="certif-circle empty" id="certif-circle" style="background:linear-gradient(160deg,#6DD5FA 40%,#2980B9 80%);"> 
        <span id="certif-icon">📦</span> 
      </div> 
      <button class="certif-nav" onclick="changeCertif(1)" aria-label="Suivant"> 
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg> 
      </button> 
    </div> 
    <div class="certif-info empty" id="certif-info"> 
      <h2 id="certif-title">À remplir</h2> 
      <p id="certif-desc">Nom et description de la certification à ajouter ici.</p> 
    </div> 
  </div> 
</section>

<li><a href="#certifications">Certifications</a></li>
